<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GodDataX Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-color: #0F0F0F;
            --accent-color: #a91d3a;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar {
            width: 260px; background-color: var(--card-color); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 30px 20px;
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent-color); margin-bottom: 5px; text-align: center; }
        .logo-sub { font-size: 10px; color: var(--text-muted); text-align: center; letter-spacing: 2px; margin-bottom: 40px; }
        .nav-item {
            padding: 12px 15px; background: rgba(169, 29, 58, 0.1); color: var(--accent-color);
            border-radius: 8px; font-weight: 600; cursor: pointer; border-left: 3px solid var(--accent-color);
        }

        /* Main Content */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { font-size: 28px; font-weight: 600; }
        
        /* Stats Cards */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card {
            background-color: var(--card-color); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color);
        }
        .stat-title { color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .stat-value { font-size: 36px; font-weight: 800; }
        .stat-value.accent { color: var(--accent-color); }
        .stat-value.green { color: #4CAF50; }

        /* Actions */
        .actions { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn {
            background-color: var(--accent-color); color: white; border: none; padding: 12px 24px;
            border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        .input-group { display: flex; gap: 10px; }
        .input-group input {
            background-color: var(--card-color); border: 1px solid var(--border-color);
            color: white; padding: 12px 16px; border-radius: 8px; outline: none; width: 300px;
        }

        /* Table */
        .table-container {
            background-color: var(--card-color); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; background: rgba(255,255,255,0.02); }
        td { font-size: 14px; }
        .status { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status.used { background: rgba(76, 175, 80, 0.1); color: #4CAF50; }
        .status.unused { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
        .btn-delete {
            background: rgba(255, 82, 82, 0.1); color: #FF5252; border: 1px solid rgba(255, 82, 82, 0.3);
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .btn-delete:hover { background: #FF5252; color: white; }
        .hwid-text { font-family: monospace; color: #aaa; }

        /* Custom Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-box {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: #FF5252;
            margin-bottom: 12px;
        }
        .modal-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .modal-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            flex: 1;
        }
        .modal-btn.confirm {
            background-color: #FF5252;
            color: white;
        }
        .modal-btn.confirm:hover {
            background-color: #ff3333;
        }
        .modal-btn.cancel {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .modal-btn.cancel:hover {
            background-color: rgba(255,255,255,0.05);
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); padding: 20px; }
            .logo-sub { margin-bottom: 15px; }
            .main { padding: 20px; }
            .stats { grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
            .actions { flex-direction: column; align-items: flex-start; gap: 15px; }
            .input-group { width: 100%; }
            .input-group input { width: 100%; }
            .table-container { overflow-x: auto; }
            table { min-width: 600px; } /* Ensures table scrolls horizontally on small screens */
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">GodDataX</div>
        <div class="logo-sub">ADMIN DASHBOARD</div>
        <div class="nav-item">License Manager</div>
    </div>

    <div class="main">
        <div class="header">
            <h1>Overview</h1>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-title">Total Licenses</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Terpakai (Aktif)</div>
                <div class="stat-value green" id="stat-used">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Belum Terpakai</div>
                <div class="stat-value accent" id="stat-unused">0</div>
            </div>
        </div>

        <div class="actions">
            <h2>Daftar Lisensi</h2>
            <form class="input-group" id="add-form">
                <input type="text" id="new-key" placeholder="Masukkan kode lisensi (misal: VIP123)" required autocomplete="off">
                <select id="new-project" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-color); color: var(--text-main); font-family: 'Inter', sans-serif;">
                    <option value="SUPREME">Supreme</option>
                    <option value="CLOUD">Cloud</option>
                    <option value="JEANS">Jeans</option>
                    <option value="ASCEND">Ascend</option>
                </select>
                <button type="submit" class="btn">+ Tambah</button>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>License Key</th>
                        <th>Status</th>
                        <th>Device HWID</th>
                        <th>Dibuat Tanggal</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" style="text-align:center; color:#888;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">Hapus Lisensi</div>
            <div id="confirm-desc" class="modal-desc">Yakin ingin menghapus lisensi ini?</div>
            <div class="modal-actions">
                <button id="confirm-cancel" class="modal-btn cancel">Batal</button>
                <button id="confirm-ok" class="modal-btn confirm">Hapus</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://eemjrotrcftjdazyheoc.supabase.co/rest/v1/licenses";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlbWpyb3RyY2Z0amRhenloZW9jIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTIyMTU3MCwiZXhwIjoyMDkwNzk3NTcwfQ.2yY8HeqdxzJI08dzqv7ZXm7nsFcSvMWEgQAMMiHHvr8";

        // Custom Confirm Modal Handler
        let confirmResolve = null;
        function showConfirm(message) {
            document.getElementById("confirm-desc").innerText = message;
            const modal = document.getElementById("confirm-modal");
            modal.style.display = "flex";
            setTimeout(() => modal.classList.add("active"), 10);
            return new Promise((resolve) => {
                confirmResolve = resolve;
            });
        }

        document.getElementById("confirm-ok").addEventListener("click", () => {
            closeConfirm(true);
        });

        document.getElementById("confirm-cancel").addEventListener("click", () => {
            closeConfirm(false);
        });

        function closeConfirm(val) {
            const modal = document.getElementById("confirm-modal");
            modal.classList.remove("active");
            setTimeout(() => {
                modal.style.display = "none";
                if(confirmResolve) confirmResolve(val);
            }, 300);
        }

        async function fetchLicenses() {
            try {
                const res = await fetch(SUPABASE_URL + "?select=*&order=created_at.desc", {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
                const data = await res.json();
                renderTable(data);
            } catch (err) {
                alert("Gagal mengambil data dari server");
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            let used = 0, unused = 0;

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">Belum ada lisensi</td></tr>`;
            }

            data.forEach(item => {
                const isUsed = item.device_id && item.device_id !== "null";
                if(isUsed) used++; else unused++;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="font-weight:600;">${item.key}</td>
                    <td><span class="status ${isUsed ? 'used' : 'unused'}">${isUsed ? 'Sudah Dipakai' : 'Belum Dipakai'}</span></td>
                    <td class="hwid-text">${isUsed ? item.device_id : '-'}</td>
                    <td style="color:#888;">${new Date(item.created_at).toLocaleString('id-ID')}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteLicense('${item.id}', '${item.key}')">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("stat-total").innerText = data.length;
            document.getElementById("stat-used").innerText = used;
            document.getElementById("stat-unused").innerText = unused;
        }

        document.getElementById("add-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("new-key");
            const projectInput = document.getElementById("new-project");
            
            const rawKey = input.value.trim().toUpperCase().replace(/-/g, "");
            const projectVal = projectInput.value.toUpperCase();
            
            if(!rawKey) return;
            const finalKey = `${projectVal}${rawKey}`;

            const btn = e.target.querySelector("button");
            btn.innerText = "..."; btn.disabled = true;

            try {
                const res = await fetch(SUPABASE_URL, {
                    method: "POST",
                    headers: { 
                        'apikey': SUPABASE_KEY, 
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ key: finalKey })
                });

                if(res.ok) {
                    input.value = "";
                    fetchLicenses();
                } else {
                    alert("Gagal menambahkan! Mungkin kode tersebut sudah ada.");
                }
            } catch (err) {
                alert("Terjadi kesalahan jaringan.");
            }
            btn.innerText = "+ Tambah"; btn.disabled = false;
        });

        async function deleteLicense(id, key) {
            const confirmed = await showConfirm(`Yakin ingin MENGHAPUS lisensi [${key}]? Jika user sedang online, mereka akan langsung otomatis ter-logout!`);
            if(!confirmed) return;
            
            try {
                const res = await fetch(SUPABASE_URL + "?id=eq." + id, {
                    method: "DELETE",
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
                if(res.ok) {
                    fetchLicenses();
                } else {
                    alert("Gagal menghapus lisensi");
                }
            } catch (err) {
                alert("Kesalahan jaringan");
            }
        }

        // Auto refresh every 10 seconds to see changes
        fetchLicenses();
        setInterval(fetchLicenses, 10000);
    </script>
</body>
</html>
